# Alembic configuration for ExamGuard AI

[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL is loaded from the environment in alembic/env.py
sqlalchemy.url = postgresql+psycopg://username:password@localhost:5432/examguard_db

# Migration file naming
file_template = %%(rev)s_%%(slug)s

# Timezone
timezone = UTC

# Output encoding
output_encoding = utf-8


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
