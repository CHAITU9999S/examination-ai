name: ExamGuard AI Database Migration Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "app/models.py"
      - ".github/workflows/migrations-check.yml"

permissions:
  contents: read

jobs:
  migration-check:
    name: PostgreSQL Alembic Upgrade
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: examguard
          POSTGRES_PASSWORD: examguard
          POSTGRES_DB: examguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examguard -d examguard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://examguard:examguard@localhost:5432/examguard_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply all Alembic migrations to a fresh PostgreSQL database
        run: |
          alembic upgrade head

      - name: Confirm migration head
        run: |
          alembic current
