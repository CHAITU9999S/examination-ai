name: Update Multiple Admin Creation Workflow

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/test_admin_bootstrap.py"
      - "requirements.txt"
      - ".github/workflows/admin-creation.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/test_admin_bootstrap.py"
      - "requirements.txt"
      - ".github/workflows/admin-creation.yml"

permissions:
  contents: read

jobs:
  admin-creation-tests:
    name: Multiple Admin Creation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure test environment
        run: |
          echo "APP_ENV=test" >> $GITHUB_ENV
          echo "DEBUG=False" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=examguard-test-only-secret-for-ci" >> $GITHUB_ENV
          echo "JWT_ALGORITHM=HS256" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///./examguard_test.db" >> $GITHUB_ENV
      - name: Test multiple Admin creation
        run: python -m pytest -v tests/test_admin_bootstrap.py
