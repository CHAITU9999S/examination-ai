name: Database Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose whether to inspect Neon migration status or apply pending migrations"
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: neon-database-migration
  cancel-in-progress: false

jobs:
  migration:
    name: Neon Database Migration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Neon connection secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the NEON_DATABASE_URL repository secret before running this workflow."
            exit 1
          fi

      - name: Check current Neon migration status (read-only)
        if: ${{ inputs.operation == 'check' }}
        run: |
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          config = Config("alembic.ini")
          scripts = ScriptDirectory.from_config(config)
          database_url = os.environ["DATABASE_URL"]
          if database_url.startswith("postgres://"):
              database_url = database_url.replace("postgres://", "postgresql+psycopg://", 1)
          elif database_url.startswith("postgresql://"):
              database_url = database_url.replace("postgresql://", "postgresql+psycopg://", 1)
          engine = create_engine(database_url, pool_pre_ping=True)

          try:
              with engine.connect() as connection:
                  current = set(MigrationContext.configure(connection).get_current_heads())
              heads = set(scripts.get_heads())

              print("Neon current revision(s):", sorted(current) or "No Alembic revision recorded")
              print("Repository migration head(s):", sorted(heads))

              if current == heads:
                  print("RESULT: Neon is up to date. No migration is pending.")
              else:
                  lower = tuple(current) if current else "base"
                  pending = list(scripts.iterate_revisions("heads", lower))
                  print("RESULT: Neon is behind the repository migration head.")
                  print("Pending migration(s):")
                  for revision in pending:
                      print(f"  - {revision.revision}: {revision.doc or 'No description'}")
                  print("This was a read-only check. Neon was not changed.")
          finally:
              engine.dispose()
          PY

      - name: Apply pending migrations to Neon
        if: ${{ inputs.operation == 'apply' }}
        run: alembic upgrade head

      - name: Verify Neon is at the latest migration revision
        if: ${{ inputs.operation == 'apply' }}
        run: |
          alembic current
          alembic heads
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          config = Config("alembic.ini")
          scripts = ScriptDirectory.from_config(config)
          database_url = os.environ["DATABASE_URL"]
          if database_url.startswith("postgres://"):
              database_url = database_url.replace("postgres://", "postgresql+psycopg://", 1)
          elif database_url.startswith("postgresql://"):
              database_url = database_url.replace("postgresql://", "postgresql+psycopg://", 1)
          engine = create_engine(database_url, pool_pre_ping=True)

          try:
              with engine.connect() as connection:
                  current = set(MigrationContext.configure(connection).get_current_heads())
              heads = set(scripts.get_heads())
              print("Neon current revision(s):", sorted(current))
              print("Repository migration head(s):", sorted(heads))
              if current != heads:
                  raise SystemExit("ERROR: Neon is not at the latest migration revision.")
              print("SUCCESS: Neon is at the latest migration revision.")
          finally:
              engine.dispose()
          PY
